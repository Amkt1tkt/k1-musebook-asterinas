# The OSDK manifest at the Asterinas root virtual workspace
# provides default OSDK settings for all packages.

# The common options for build, run and test
[boot]
method = "grub-rescue-iso"

[grub]
boot_protocol = "multiboot2"

[qemu]
args = "$(./tools/qemu_args.sh normal)"
log_file = "qemu-serial.log"

# Special options for running
[run.boot]
kcmd_args = [
    "SHELL=/bin/sh",
    "LOGNAME=root",
    "HOME=/",
    "USER=root",
    "PATH=/bin:/benchmark",
]
init_args = ["sh", "-l"]

# Special options for testing
[test.qemu]
args = "$(./tools/qemu_args.sh test)"

# Other Schemes

[scheme."microvm"]
boot.method = "vmm-direct"
build.strip_elf = true
qemu.args = "$(./tools/qemu_args.sh microvm)"

[scheme."iommu"]
supported_archs = ["x86_64"]
qemu.args = "$(./tools/qemu_args.sh iommu)"

[scheme."tdx"]
supported_archs = ["x86_64"]
build.features = ["cvm_guest"]
boot.method = "grub-qcow2"
grub.boot_protocol = "linux"
qemu.args = "$(./tools/qemu_args.sh tdx)"

[scheme."riscv"]
supported_archs = ["riscv64"]
boot.method = "vmm-direct"
build.strip_elf = false
qemu.args = "$(./tools/qemu_args.sh riscv)"

# K1 MUSE Book --- (RustSBI enters the board image at physical 0x200000)
# Keep the generic RISC-V template at QEMU's address. OSDK places these flags
# before -T, so the template's default can be overridden before LOAD layout.
# vmm-direct selects the ELF build later converted to the board's flat image.
[scheme."k1"]
supported_archs = ["riscv64"]
boot.method = "vmm-direct"
build.strip_elf = false
build.rustflags = "-C link-arg=--defsym=KERNEL_LMA=0x200000"
# K1 MUSE Book ---

[scheme."sifive_u"]
supported_archs = ["riscv64"]
build.features = ["riscv_sv39_mode"]
boot.method = "vmm-direct"
build.strip_elf = false
qemu.with_monitor = true

qemu.args = """\
    -machine sifive_u \
    -m 8G \
    -smp 5 \
    -no-reboot \
    -nographic \
    -display none \
    -serial chardev:mux \
    -monitor chardev:mux \
    -chardev stdio,id=mux,mux=on,signal=off,logfile=qemu.log
"""

[scheme."loongarch"]
boot.method = "vmm-direct"
build.strip_elf = false

qemu.args = """\
    -machine virt \
    -m 8G \
    -smp 1 \
    --no-reboot \
    -nographic \
    -display none \
    -serial chardev:mux \
    -monitor chardev:mux \
    -chardev stdio,id=mux,mux=on,signal=off,logfile=qemu.log \
    -device virtio-keyboard-pci \
    -device virtio-serial \
    -device virtconsole,chardev=mux \
    -rtc base=utc
"""

[scheme."aarch64"]
supported_archs = ["aarch64"]
boot.method = "vmm-direct"
build.strip_elf = false
qemu.args = "$(./tools/qemu_args.sh aarch64)"
