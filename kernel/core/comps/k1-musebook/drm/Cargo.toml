[package]
name = "k1-musebook-drm"
version = "0.1.0"
edition.workspace = true

# K1 MUSE Book: Linux-ABI-compatible DRM/KMS core. Must never depend on
# k1-musebook-pvr so it builds on machines with no GPU.

[dependencies]
aster-softirq.workspace = true
bitflags.workspace = true
component.workspace = true
ostd.workspace = true
ostd-pod.workspace = true
spin.workspace = true
# Required explicitly by `ostd-pod`'s derive macros, which expand to
# compile-time checks that reference `zerocopy` by crate name.
zerocopy.workspace = true

[lints]
workspace = true
