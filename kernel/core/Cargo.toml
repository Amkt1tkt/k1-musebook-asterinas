[package]
name = "aster-core"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
align_ext.workspace = true
aster-bigtcp.workspace = true
aster-block.workspace = true
aster-cmdline.workspace = true
aster-console.workspace = true
aster-device.workspace = true
aster-framebuffer.workspace = true
aster-fuse.workspace = true
aster-input.workspace = true
aster-logger.workspace = true
aster-network.workspace = true
aster-nvme.workspace = true
aster-rights.workspace = true
aster-rights-proc.workspace = true
aster-softirq.workspace = true
aster-systree.workspace = true
aster-time.workspace = true
aster-util.workspace = true
aster-virtio.workspace = true
atomic-integer-wrapper.workspace = true
bitflags.workspace = true
bitvec.workspace = true
component.workspace = true
const_format.workspace = true
cpio-decoder.workspace = true
device-id.workspace = true
getset.workspace = true
hashbrown.workspace = true
id-alloc.workspace = true
inherit-methods-macro.workspace = true
inventory.workspace = true
intrusive-collections.workspace = true
int-to-c-enum.workspace = true
io-util.workspace = true
jhash.workspace = true
keyable-arc.workspace = true
lending-iterator.workspace = true
logo-ascii-art.workspace = true
lru.workspace = true
miniz_oxide.workspace = true
osdk-frame-allocator.workspace = true
osdk-heap-allocator.workspace = true
ostd.workspace = true
ostd-pod.workspace = true
paste.workspace = true
rand = { workspace = true, features = ["small_rng", "std_rng"] }
ring-buffer.workspace = true
short-vis-path.workspace = true
smallvec.workspace = true
sparse-id-alloc.workspace = true
spin.workspace = true
takeable.workspace = true
time.workspace = true
typeflags-util.workspace = true
typeflags.workspace = true
xarray.workspace = true
xmas-elf.workspace = true
zerocopy.workspace = true

[target.x86_64-unknown-none.dependencies]
tdx-guest = { workspace = true, optional = true }
x86_64.workspace = true

[target.riscv64imac-unknown-none-elf.dependencies]
riscv.workspace = true
# K1 MUSE Book --- (SpacemiT K1 MUSE Book board components; riscv64-only so the other
#   architectures never see them. The optional ones are gated by the features below.)
k1-musebook-cpufreq = { workspace = true, optional = true }
k1-musebook-drm.workspace = true
k1-musebook-gpio.workspace = true
k1-musebook-i2c.workspace = true
k1-musebook-pinctrl.workspace = true
k1-musebook-power.workspace = true
k1-musebook-pvr = { workspace = true, optional = true }
k1-musebook-thermal.workspace = true
k1-musebook-usb.workspace = true
# K1 MUSE Book ---

[target.loongarch64-unknown-none-softfloat.dependencies]
loongArch64.workspace = true

[features]
default = ["cvm_guest"]
coverage = ["ostd/coverage"]
cvm_guest = ["dep:tdx-guest", "ostd/cvm_guest", "aster-virtio/cvm_guest"]
pvh_boot = ["ostd/pvh_boot"]
# By default we use the Sv48 address translation mode.
riscv_sv39_mode = ["ostd/riscv_sv39_mode"]
# K1 MUSE Book --- (board features used with the explicit OSDK k1 scheme)
# PowerVR BXE-2-32 GPU driver (safe-Rust port of the upstream `powervr` DRM driver).
pvr = ["dep:k1-musebook-pvr"]
# SpacemiT K1 DVFS (OPP table + SPM8821 dcdc1 scaling + TSEN thermal capping).
cpufreq = ["dep:k1-musebook-cpufreq"]
# USB3 xHCI host + mass storage + HID on the K1 DWC3. The USB crate itself is
# always linked for the EHCI1/USB2 path; this only enables its `xhci` feature.
usb = ["k1-musebook-usb/xhci"]
# K1 MUSE Book ---

[lints]
workspace = true
