[package]
name = "asterinas"
version = "0.1.0"
edition.workspace = true

[dependencies]
aster-core.workspace = true
ostd.workspace = true

# High-level component crates.
#
# Keep this list in sync with the `extern crate` declarations in `src/lib.rs`.
aster-uart.workspace = true

# K1 MUSE Book --- (RISC-V uses the K1 DRM registry and its software fallback)
# aster-drm.workspace = true
# aster-simpledrm.workspace = true
[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
aster-drm.workspace = true
aster-simpledrm.workspace = true
# K1 MUSE Book ---

[target.x86_64-unknown-none.dependencies]
aster-i8042.workspace = true

[features]
default = ["cvm_guest"]
coverage = ["aster-core/coverage"]
cvm_guest = ["aster-core/cvm_guest"]
pvh_boot = ["aster-core/pvh_boot"]
riscv_sv39_mode = ["aster-core/riscv_sv39_mode"]
# K1 MUSE Book --- (forward the board features to aster-core)
pvr = ["aster-core/pvr"]
cpufreq = ["aster-core/cpufreq"]
usb = ["aster-core/usb"]
# K1 MUSE Book ---

[lints]
workspace = true
